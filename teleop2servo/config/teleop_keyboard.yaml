teleop_keyboard:
  ros__parameters:
    publish_hz: 250

    stop_moving_timeout_s: 0.4

    # serwo topics
    twist_topic: "/servo_node/delta_twist_cmds"
    joint_topic: "/servo_node/delta_joint_cmds"
    queue_size: 10

    base_frame_id: "base_link"
    ee_frame_id: "tool0"

    # speeds
    joint_vel_step: 1.0
    joint_vel_cont_slow: 1.0

    twist_lin_step: 0.05
    twist_lin_cont_slow: 1.0

    twist_rot_step: 0.20
    twist_rot_cont_slow: 0.35

    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
